document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

one is actually betting on.<\u002Fh1>\n      <p style=\"margin:0 0 26px;font-size:clamp(16px,2.2vw,20px);line-height:1.6;color:#B9BDC2;max-width:660px;text-wrap:pretty\">All three use the same facts — 24/7 Whatcom County coverage, $1M insurance, USDOT&nbsp;7188992, roadside services, free quotes. What changes is who they're built for and how fast they get to the phone call. This page lays out the differences, the trade-offs, what the local market looks like, and where North Line has room to win.<\u002Fp>\n      <a href=\"index.html\" style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 24px;background:#F2A100;color:#141517;border-radius:5px;font-family:Archivo,sans-serif;font-size:16px;font-weight:700;text-decoration:none\">View the three designs →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:900px;margin:0 auto;padding:clamp(36px,6vw,64px) clamp(20px,5vw,40px) 0\">\n\n    <div style=\"margin-bottom:clamp(40px,6vw,64px)\">\n      <div style=\"font-family:Archivo,sans-serif;font-size:12.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#B3261E;margin-bottom:12px\">01 · At a glance<\u002Fdiv>\n      <h2 style=\"margin:0 0 10px;font-family:Archivo,sans-serif;font-size:clamp(26px,4.5vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.12\">What's different between them<\u002Fh2>\n      <p style=\"margin:0 0 28px;font-size:clamp(16px,2.1vw,18.5px);line-height:1.65;color:#57524A;text-wrap:pretty\">Same content, three different front doors.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px\">\n        <div style=\"border:1px solid #E2DDD3;border-radius:12px;overflow:hidden;background:#FFF\">\n          <div style=\"background:#141517;padding:18px 20px\">\n            <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:8px\">\n              <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.14em;background:#F2A100;color:#141517;padding:4px 9px;border-radius:3px\">1A<\u002Fdiv>\n              <div style=\"font-family:Oswald,sans-serif;font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#F5F1EA\">Rugged<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5;color:#8B8F94\">Charcoal + safety amber · condensed caps · photo-led<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:20px;display:flex;flex-direction:column;gap:14px\">\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A8377;margin-bottom:5px\">The bet<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.6;color:#3A3630;text-wrap:pretty\">People hire the truck they can see. Lead with the flatbed and look like the real thing.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A8377;margin-bottom:5px\">Built for<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.6;color:#3A3630\">Drivers who want a capable local operator, not a call center.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A8377;margin-bottom:5px\">Feels like<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.6;color:#3A3630\">Confident and hands-on. Closest to how a working tow outfit actually talks.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #E2DDD3;border-radius:12px;overflow:hidden;background:#FFF\">\n          <div style=\"background:#10243E;padding:18px 20px\">\n            <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:8px\">\n              <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.14em;background:#FFF;color:#10243E;padding:4px 9px;border-radius:3px\">1B<\u002Fdiv>\n              <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:800;letter-spacing:-.01em;color:#FFF\">Professional<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5;color:#9FB0C2\">Navy + brick red · serif copy · quote form<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:20px;display:flex;flex-direction:column;gap:14px\">\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A8377;margin-bottom:5px\">The bet<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.6;color:#3A3630;text-wrap:pretty\">Credentials close the deal. Show licensing, insurance and process, and capture non-urgent work in writing.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A8377;margin-bottom:5px\">Built for<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.6;color:#3A3630\">Shops, dealerships, fleets, insurers, property managers — and cautious retail customers.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A8377;margin-bottom:5px\">Feels like<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.6;color:#3A3630\">A business with a back office. Widest reach; least distinctive.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #E2DDD3;border-radius:12px;overflow:hidden;background:#FFF\">\n          <div style=\"background:#0B0B0C;padding:18px 20px\">\n            <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:8px\">\n              <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.14em;background:#FFD400;color:#0B0B0C;padding:4px 9px;border-radius:3px\">1C<\u002Fdiv>\n              <div style=\"font-family:Anton,sans-serif;font-size:18px;letter-spacing:.02em;text-transform:uppercase;color:#FFF\">Urgent<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5;color:#8A8A8F\">Black + hazard yellow · huge phone number · minimal<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:20px;display:flex;flex-direction:column;gap:14px\">\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A8377;margin-bottom:5px\">The bet<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.6;color:#3A3630;text-wrap:pretty\">Nobody reads a website in a breakdown. Remove every step between landing and dialling.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A8377;margin-bottom:5px\">Built for<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.6;color:#3A3630\">Someone on the shoulder of I-5 with one bar of signal and a dead car.<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8A8377;margin-bottom:5px\">Feels like<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.6;color:#3A3630\">Emergency signage. Highest call rate; thinnest on trust-building.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom:clamp(40px,6vw,64px)\">\n      <div style=\"font-family:Archivo,sans-serif;font-size:12.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#B3261E;margin-bottom:12px\">02 · Trade-offs<\u002Fdiv>\n      <h2 style=\"margin:0 0 28px;font-family:Archivo,sans-serif;font-size:clamp(26px,4.5vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.12\">Pros and cons<\u002Fh2>\n\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n\n        <div style=\"border:1px solid #E2DDD3;border-left:4px solid #F2A100;border-radius:0 12px 12px 0;background:#FFF;padding:clamp(20px,3vw,28px)\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap\">\n            <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.14em;background:#141517;color:#F2A100;padding:5px 10px;border-radius:3px\">1A<\u002Fdiv>\n            <div style=\"font-family:Archivo,sans-serif;font-size:clamp(18px,2.6vw,22px);font-weight:800;letter-spacing:-.02em\">Rugged &amp; photo-led<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px\">\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#1E8E4E;margin-bottom:10px\">Pros<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px;font-size:15.5px;line-height:1.55;color:#3A3630\">\n                <div>Your truck photo does most of the selling — real equipment, real lettering, real USDOT on the door.<\u002Fdiv>\n                <div>Reads as an owner-operator, which is the actual competitive advantage against the big yards.<\u002Fdiv>\n                <div>Numbered service list is scannable and easy to add to later.<\u002Fdiv>\n                <div>Most distinctive of the three; least likely to look like a template.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#B3261E;margin-bottom:10px\">Cons<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px;font-size:15.5px;line-height:1.55;color:#3A3630\">\n                <div>Lives or dies on photo quality — needs good shots kept current.<\u002Fdiv>\n                <div>Dark design; the amber-on-charcoal needs care to stay readable in sunlight on a phone.<\u002Fdiv>\n                <div>No lead-capture form, so planned-tow enquiries still depend on a phone call or email.<\u002Fdiv>\n                <div>\"Tough\" tone can read as less corporate to an insurance or fleet contact.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #E2DDD3;border-left:4px solid #10243E;border-radius:0 12px 12px 0;background:#FFF;padding:clamp(20px,3vw,28px)\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap\">\n            <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.14em;background:#10243E;color:#FFF;padding:5px 10px;border-radius:3px\">1B<\u002Fdiv>\n            <div style=\"font-family:Archivo,sans-serif;font-size:clamp(18px,2.6vw,22px);font-weight:800;letter-spacing:-.02em\">Professional &amp; reassuring<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px\">\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#1E8E4E;margin-bottom:10px\">Pros<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px;font-size:15.5px;line-height:1.55;color:#3A3630\">\n                <div>The only version that captures work while you're asleep or under a car — the quote form.<\u002Fdiv>\n                <div>\"How a call goes\" pre-answers the two things people fear: cost and wait time.<\u002Fdiv>\n                <div>Credentials block (UBI, USDOT, $1M, proof on request) is exactly what B2B referrers look for.<\u002Fdiv>\n                <div>Easiest to grow — add pages, reviews, fleet section, service-area pages for search.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#B3261E;margin-bottom:10px\">Cons<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px;font-size:15.5px;line-height:1.55;color:#3A3630\">\n                <div>Longest page — more scrolling before the emergency caller acts.<\u002Fdiv>\n                <div>The form creates an expectation of a reply; it needs to be answered same-day or it hurts.<\u002Fdiv>\n                <div>Safest-looking of the three, so it's the easiest to confuse with a bigger competitor.<\u002Fdiv>\n                <div>Slight risk of over-promising a \"dispatch\" operation when it's one truck.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #E2DDD3;border-left:4px solid #FFD400;border-radius:0 12px 12px 0;background:#FFF;padding:clamp(20px,3vw,28px)\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap\">\n            <div style=\"font-family:Archivo,sans-serif;font-size:11px;font-weight:800;letter-spacing:.14em;background:#0B0B0C;color:#FFD400;padding:5px 10px;border-radius:3px\">1C<\u002Fdiv>\n            <div style=\"font-family:Archivo,sans-serif;font-size:clamp(18px,2.6vw,22px);font-weight:800;letter-spacing:-.02em\">Urgent &amp; stripped down<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px\">\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#1E8E4E;margin-bottom:10px\">Pros<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px;font-size:15.5px;line-height:1.55;color:#3A3630\">\n                <div>Fastest to a phone call — the number is the hero, not a button hiding in a header.<\u002Fdiv>\n                <div>Works on a cracked phone screen in the rain: huge type, massive tap targets, high contrast.<\u002Fdiv>\n                <div>Hazard-stripe styling is memorable and hard to confuse with anyone else in the county.<\u002Fdiv>\n                <div>Shortest to build and cheapest to maintain.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:Archivo,sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#B3261E;margin-bottom:10px\">Cons<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px;font-size:15.5px;line-height:1.55;color:#3A3630\">\n                <div>Thinnest on trust — a nervous customer has less to read before deciding.<\u002Fdiv>\n                <div>Almost nothing for planned tows or commercial referrals; those buyers want detail.<\u002Fdiv>\n                <div>Yellow-and-black reads a bit like impound signage, which is the wrong association.<\u002Fdiv>\n                <div>Less room to grow without breaking the concept.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom:clamp(40px,6vw,64px);background:#141517;border-radius:14px;padding:clamp(24px,4vw,40px)\">\n      <div style=\"font-family:Archivo,sans-serif;font-size:12.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#F2A100;margin-bottom:12px\">03 · Recommendation<\u002Fdiv>\n      <h2 style=\"margin:0 0 16px;font-family:Archivo,sans-serif;font-size:clamp(24px,4.2vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.15;color:#F5F1EA\">Our pick: 1A, with 1B's spine.<\u002Fh2>\n      <p style=\"margin:0 0 18px;font-size:clamp(16px,2.1vw,18.5px);line-height:1.65;color:#B9BDC2;text-wrap:pretty\">1A is the one that looks like nobody else in Whatcom County and puts the actual truck front and centre — that's the honest advantage of an owner-operator. What it's missing are the two things that earn money quietly: a quote form for planned work, and a credentials block a shop or insurance adjuster can point at.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px\">\n        <div style=\"background:#1B1D20;border-radius:9px;padding:18px\">\n          <div style=\"font-family:Oswald,sans-serif;font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#F2A100;margin-bottom:8px\">Keep from 1A<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:#9AA0A6\">Photo hero, amber trust strip, numbered services, owner-operator voice.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#1B1D20;border-radius:9px;padding:18px\">\n          <div style=\"font-family:Oswald,sans-serif;font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#F2A100;margin-bottom:8px\">Add from 1B<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:#9AA0A6\">Quote form, \"how a call goes\" section, credentials panel with proof-on-request.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#1B1D20;border-radius:9px;padding:18px\">\n          <div style=\"font-family:Oswald,sans-serif;font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#F2A100;margin-bottom:8px\">Add from 1C<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:#9AA0A6\">The sticky bottom call bar on mobile. That single element will drive most of the calls.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom:clamp(40px,6vw,64px)\">\n      <div style=\"font-family:Archivo,sans-serif;font-size:12.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#B3261E;margin-bottom:12px\">04 · Market<\u002Fdiv>\n      <h2 style=\"margin:0 0 10px;font-family:Archivo,sans-serif;font-size:clamp(26px,4.5vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.12\">What matters in this market<\u002Fh2>\n      <p style=\"margin:0 0 26px;font-size:clamp(16px,2.1vw,18.5px);line-height:1.65;color:#57524A;text-wrap:pretty\">Towing is a distress purchase. Nobody browses. The site's whole job is to be found, be believed in about four seconds, and be dialled.<\u002Fp>\n\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;gap:16px;align-items:flex-start;background:#FFF;border:1px solid #E2DDD3;border-radius:11px;padding:20px\">\n          <div style=\"font-family:Anton,sans-serif;font-size:26px;color:#F2A100;line-height:1;flex-shrink:0\">01<\u002Fdiv>\n          <div>\n            <div style=\"font-family:Archivo,sans-serif;font-size:17.5px;font-weight:800;letter-spacing:-.015em;margin-bottom:6px\">It's a phone-first, mobile-first purchase<\u002Fdiv>\n            <div style=\"font-size:15.5px;line-height:1.6;color:#57524A;text-wrap:pretty\">People search \"tow truck near me\" on a phone and call the first plausible result. Click-to-call above the fold, a sticky call bar, and a Google Business Profile matter more than anything else on the page. Every version here is designed mobile-first for that reason.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:flex-start;background:#FFF;border:1px solid #E2DDD3;border-radius:11px;padding:20px\">\n          <div style=\"font-family:Anton,sans-serif;font-size:26px;color:#F2A100;line-height:1;flex-shrink:0\">02<\u002Fdiv>\n          <div>\n            <div style=\"font-family:Archivo,sans-serif;font-size:17.5px;font-weight:800;letter-spacing:-.015em;margin-bottom:6px\">The two fears are price and wait<\u002Fdiv>\n            <div style=\"font-size:15.5px;line-height:1.6;color:#57524A;text-wrap:pretty\">Towing has a bad reputation for surprise invoices. \"Free quote, price before we roll, no call-out surprises\" is a genuine differentiator, and it costs nothing to promise if that’s already how you work. Local directory data puts a typical Bellingham tow in the rough range of <a href=\"https://www.whatcomlocal.com/l/bellingham-wa/auto-towing\">$60–$130 for basic work<\u002Fa> — worth knowing, but we'd still keep numbers off the site and quote by phone.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:flex-start;background:#FFF;border:1px solid #E2DDD3;border-radius:11px;padding:20px\">\n          <div style=\"font-family:Anton,sans-serif;font-size:26px;color:#F2A100;line-height:1;flex-shrink:0\">03<\u002Fdiv>\n          <div>\n            <div style=\"font-family:Archivo,sans-serif;font-size:17.5px;font-weight:800;letter-spacing:-.015em;margin-bottom:6px\">Blaine is a real geographic advantage<\u002Fdiv>\n            <div style=\"font-size:15.5px;line-height:1.6;color:#57524A;text-wrap:pretty\">Almost every established competitor is based in Bellingham. Being at 3836 H Street Rd means you’re closest to the border crossings, Birch Bay, Custer, Point Roberts and the north end of I-5 — the exact area where a Bellingham yard quotes a 40-minute wait. That's worth saying out loud on the page.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:flex-start;background:#FFF;border:1px solid #E2DDD3;border-radius:11px;padding:20px\">\n          <div style=\"font-family:Anton,sans-serif;font-size:26px;color:#F2A100;line-height:1;flex-shrink:0\">04<\u002Fdiv>\n          <div>\n            <div style=\"font-family:Archivo,sans-serif;font-size:17.5px;font-weight:800;letter-spacing:-.015em;margin-bottom:6px\">Flatbed-only is a selling point, not a limitation<\u002Fdiv>\n            <div style=\"font-size:15.5px;line-height:1.6;color:#57524A;text-wrap:pretty\">All-wheel-drive vehicles, EVs, lowered cars, classics and low-clearance imports should be flatbedded, not dragged on a wheel-lift. Your photos show a Jerr-Dan rollback with a 26,000&nbsp;lb GVW rating. \"Flatbed only — no drivetrain damage\" wins the careful owners and every shop that has to warranty the work.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:flex-start;background:#FFF;border:1px solid #E2DDD3;border-radius:11px;padding:20px\">\n          <div style=\"font-family:Anton,sans-serif;font-size:26px;color:#F2A100;line-height:1;flex-shrink:0\">05<\u002Fdiv>\n          <div>\n            <div style=\"font-family:Archivo,sans-serif;font-size:17.5px;font-weight:800;letter-spacing:-.015em;margin-bottom:6px\">The steady money isn't emergencies<\u002Fdiv>\n            <div style=\"font-size:15.5px;line-height:1.6;color:#57524A;text-wrap:pretty\">Your photos show USPS route vehicles on the deck — that's contract fleet work: repeatable, scheduled, and it doesn't wake you at 3am. A short \"fleet &amp; commercial\" line on the site (fleets, dealerships, repair shops, property managers, municipal contracts) is probably the highest-value paragraph on the whole page.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:flex-start;background:#FFF;border:1px solid #E2DDD3;border-radius:11px;padding:20px\">\n          <div style=\"font-family:Anton,sans-serif;font-size:26px;color:#F2A100;line-height:1;flex-shrink:0\">06<\u002Fdiv>\n          <div>\n            <div style=\"font-family:Archivo,sans-serif;font-size:17.5px;font-weight:800;letter-spacing:-.015em;margin-bottom:6px\">Seasonality is predictable<\u002Fdiv>\n            <div style=\"font-size:15.5px;line-height:1.6;color:#57524A;text-wrap:pretty\">Winter brings Mount Baker Highway recoveries and battery failures; summer brings tourist traffic on Chuckanut and the border queues. Worth planning seasonal copy and a winter recovery mention rather than a static page.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showCompetitors }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-bottom:clamp(40px,6vw,64px)\">\n      <div style=\"font-family:Archivo,sans-serif;font-size:12.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#B3261E;margin-bottom:12px\">05 · Competitors<\u002Fdiv>\n      <h2 style=\"margin:0 0 10px;font-family:Archivo,sans-serif;font-size:clamp(26px,4.5vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.12\">Who else is in Whatcom County<\u002Fh2>\n      <p style=\"margin:0 0 26px;font-size:clamp(16px,2.1vw,18.5px);line-height:1.65;color:#57524A;text-wrap:pretty\">A crowded field of long-established yards, most of them Bellingham-based and most of them also doing impounds. Details below come from their own public listings.<\u002Fp>\n\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"background:#FFF;border:1px solid #E2DDD3;border-radius:11px;padding:20px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:8px\">\n            <div style=\"font-family:Archivo,sans-serif;font-size:18.5px;font-weight:800;letter-spacing:-.02em\">Berk's Towing<\u002Fdiv>\n            <div style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A8377\">Bellingham · the incumbent<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:15.5px;line-height:1.6;color:#57524A;text-wrap:pretty\"><a href=\"https://www.berkstowing.com/\">Trading since 1960<\u002Fa> and positioning itself as the county's only full-service towing company, with a crane division alongside the tow work. Enormous name recognition and heavy equipment.<br><span style=\"color:#1A1815;font-weight:600\">Gap to exploit:<\u002Fspan> big-yard scheduling and a Bellingham base. North Line can be the faster, more personal option north of Ferndale.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFF;border:1px solid #E2DDD3;border-radius:11px;padding:20px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:8px\">\n            <div style=\"font-family:Archivo,sans-serif;font-size:18.5px;font-weight:800;letter-spacing:-.02em\">ASAP Towing<\u002Fdiv>\n            <div style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A8377\">Bellingham + Lynden + Blaine<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:15.5px;line-height:1.6;color:#57524A;text-wrap:pretty\">The closest direct threat. <a href=\"https://www.yelp.com/biz/asap-towing-bellingham-2\">Serving the county since 1993<\u002Fa>, and since 2009 it has added Blaine Towing and Transport and ASAP Towing of Lynden, so it already has a foothold in North Line's own territory. Its listing advertises 24/7 service, cross-border towing, fleet discounts, direct insurance billing and professional impound services.<br><span style=\"color:#1A1815;font-weight:600\">Gap to exploit:<\u002Fspan> it runs impounds. A customer who has been towed by an impound company doesn't feel like a customer. \"We never impound — we only work for you\" is a clean, true contrast if that's accurate for North Line.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFF;border:1px solid #E2DDD3;border-radius:11px;padding:20px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:8px\">\n            <div style=\"font-family:Archivo,sans-serif;font-size:18.5px;font-weight:800;letter-spacing:-.02em\">F.A.S.T. Towing<\u002Fdiv>\n            <div style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A8377\">Bellingham · price fighter<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:15.5px;line-height:1.6;color:#57524A;text-wrap:pretty\">Family-run <a href=\"https://www.yelp.com/biz/f-a-s-t-towing-bellingham\">since 2008<\u002Fa>, competing openly on being the cheapest rates in town, with light-to-medium towing plus tire changes, fuel delivery and jump starts — and it buys vehicles in any condition.<br><span style=\"color:#1A1815;font-weight:600\">Gap to exploit:<\u002Fspan> don't race them to the bottom. Compete on flatbed care, response time in the north county, and an actual quote before the truck rolls.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFF;border:1px solid #E2DDD3;border-radius:11px;padding:20px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:8px\">\n            <div style=\"font-family:Archivo,sans-serif;font-size:18.5px;font-weight:800;letter-spacing:-.02em\">Heston Hauling / Heston Towing<\u002Fdiv>\n            <div style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A8377\">Bellingham · commercial angle<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:15.5px;line-height:1.6;color:#57524A;text-wrap:pretty\"><a href=\"https://www.hestonhaulingwa.com/bellingham-office\">Serving Whatcom and Skagit for over ten years<\u002Fa>, with 24/7 towing, impound retrieval around the clock, and direct billing to most insurance companies.<br><span style=\"color:#1A1815;font-weight:600\">Gap to exploit:<\u002Fspan> direct insurance billing is table stakes for B2B here. Worth finding out whether North Line can offer it — if so, it belongs on the site.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFF;border:1px solid #E2DDD3;border-radius:11px;padding:20px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:8px\">\n            <div style=\"font-family:Archivo,sans-serif;font-size:18.5px;font-weight:800;letter-spacing:-.02em\">The long tail<\u002Fdiv>\n            <div style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A8377\">County-wide<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:15.5px;line-height:1.6;color:#57524A;text-wrap:pretty\">Bel-Co Towing, Checker Towing, Johnson's Towing, B.J.'s Towing in Sumas and others fill out <a href=\"https://www.whatcomlocal.com/l/wa/auto-towing\">the local directories<\u002Fa>. Most have thin or dated web presence.<br><span style=\"color:#1A1815;font-weight:600\">Gap to exploit:<\u002Fspan> a fast, modern, mobile-first page with a real photo of the truck genuinely outclasses most of this field.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFF3E0;border:1px solid #F0D9A8;border-radius:11px;padding:20px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:8px\">\n            <div style=\"font-family:Archivo,sans-serif;font-size:18.5px;font-weight:800;letter-spacing:-.02em\">Lead-generation sites<\u002Fdiv>\n            <div style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A8377\">The invisible competitor<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:15.5px;line-height:1.6;color:#57524A;text-wrap:pretty\">National brokers run city-specific pages for Bellingham and dispatch calls out to whoever is in <a href=\"https://truetowing.com/washington/bellingham/\">their network<\u002Fa>. They often outrank real local operators, then take a cut.<br><span style=\"color:#1A1815;font-weight:600\">Gap to exploit:<\u002Fspan> \"You're calling the owner, not a call centre\" — plus a properly filled-out Google Business Profile with real photos and reviews, which is what actually beats them locally.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"margin-bottom:clamp(40px,6vw,64px);background:#10243E;border-radius:14px;padding:clamp(24px,4vw,40px)\">\n      <div style=\"font-family:Archivo,sans-serif;font-size:12.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#F2A100;margin-bottom:12px\">06 · Positioning<\u002Fdiv>\n      <h2 style=\"margin:0 0 14px;font-family:Archivo,sans-serif;font-size:clamp(24px,4.2vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.15;color:#FFF\">How to set North Line apart<\u002Fh2>\n      <p style=\"margin:0 0 26px;font-size:clamp(16px,2.1vw,18.5px);line-height:1.65;color:#9FB0C2;max-width:620px;text-wrap:pretty\">Six claims, in the order we'd put them on the page. Each one is defensible against the incumbents and none of them require you to be bigger than you are.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:14px\">\n        <div style=\"background:#0B1B2E;border-radius:10px;padding:20px\">\n          <div style=\"font-family:Anton,sans-serif;font-size:15px;letter-spacing:.1em;color:#F2A100;margin-bottom:9px\">01<\u002Fdiv>\n          <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:800;color:#FFF;margin-bottom:7px\">The north county's own truck<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:#B6C4D3;text-wrap:pretty\">Based in Blaine, not Bellingham. Closest help for the border, Birch Bay, Custer and Point Roberts.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B1B2E;border-radius:10px;padding:20px\">\n          <div style=\"font-family:Anton,sans-serif;font-size:15px;letter-spacing:.1em;color:#F2A100;margin-bottom:9px\">02<\u002Fdiv>\n          <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:800;color:#FFF;margin-bottom:7px\">You get the owner, not a call centre<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:#B6C4D3;text-wrap:pretty\">The person who answers is the person who arrives. Directly aimed at the national lead-gen brokers.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B1B2E;border-radius:10px;padding:20px\">\n          <div style=\"font-family:Anton,sans-serif;font-size:15px;letter-spacing:.1em;color:#F2A100;margin-bottom:9px\">03<\u002Fdiv>\n          <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:800;color:#FFF;margin-bottom:7px\">Flatbed only. No drivetrain damage.<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:#B6C4D3;text-wrap:pretty\">The right answer for AWD, EVs, lowered cars and classics — and the reason shops recommend you.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B1B2E;border-radius:10px;padding:20px\">\n          <div style=\"font-family:Anton,sans-serif;font-size:15px;letter-spacing:.1em;color:#F2A100;margin-bottom:9px\">04<\u002Fdiv>\n          <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:800;color:#FFF;margin-bottom:7px\">Price before the truck moves<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:#B6C4D3;text-wrap:pretty\">Free quote, upfront number, no call-out surprises. Answers the single biggest fear in the category.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B1B2E;border-radius:10px;padding:20px\">\n          <div style=\"font-family:Anton,sans-serif;font-size:15px;letter-spacing:.1em;color:#F2A100;margin-bottom:9px\">05<\u002Fdiv>\n          <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:800;color:#FFF;margin-bottom:7px\">We help you — we don't impound you<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:#B6C4D3;text-wrap:pretty\">Several of the biggest local yards run impound operations. North Line is there to get you moving, not to hold your vehicle.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B1B2E;border-radius:10px;padding:20px\">\n          <div style=\"font-family:Anton,sans-serif;font-size:15px;letter-spacing:.1em;color:#F2A100;margin-bottom:9px\">06<\u002Fdiv>\n          <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:800;color:#FFF;margin-bottom:7px\">Trusted with fleet work<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.6;color:#B6C4D3;text-wrap:pretty\">Hauling government route vehicles is real proof — the kind dealerships, repair shops and property managers look for.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding:clamp(22px,4vw,32px);background:#F2A100;border-radius:14px\">\n      <div style=\"font-family:Archivo,sans-serif;font-size:clamp(20px,3.4vw,27px);font-weight:800;letter-spacing:-.025em;color:#141517;margin-bottom:8px\">Pick a direction and we'll build it out properly.<\u002Fdiv>\n      <div style=\"font-size:16.5px;line-height:1.6;color:rgba(20,21,23,.75);margin-bottom:20px;text-wrap:pretty\">1A, 1B, 1C, or the hybrid — whichever you choose becomes a finished page, with the remaining sections, your photos and the mobile behaviour all wired up.<\u002Fdiv>\n      <a href=\"index.html\" style=\"display:inline-flex;align-items:center;min-height:50px;padding:0 26px;background:#141517;color:#F2A100;border-radius:6px;font-family:Archivo,sans-serif;font-size:16px;font-weight:700;text-decoration:none\">Back to the three designs →<\u002Fa>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showCompetitors&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showCompetitors: this.props.showCompetitors ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
